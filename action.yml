name: tfcap Plan Guard
description: Inventory Terraform/OpenTofu module capabilities and catch risky module upgrades and tag mutation.
author: r-morato
branding:
  icon: shield
  color: purple

inputs:
  working-directory:
    description: Terraform root module directory. Run `terraform init` (or `tofu init`) first.
    default: "."
  mode:
    description: >-
      verify (check against tfcap.lock.json), scan (inventory everything),
      approve-prepare + approve-commit (approve module changes from a PR label,
      split so that untrusted PR code never runs with a write token), or
      approve (both halves in one job; simpler, but runs terraform init on PR
      code with a write token)
    default: verify
  approve-label:
    description: "approve mode: the pull request label that approves module changes"
    default: tfcap-approved
  status-context:
    description: "approve mode: name of the commit status to set; match your verify job's check name"
    default: tfcap
  fail-on:
    description: Fail the job when a finding is at or above this severity (none|info|low|medium|high|critical).
    default: high
  min-severity:
    description: Hide findings below this severity.
    default: low
  third-party-only:
    description: Only report capabilities from third-party modules (scan mode).
    default: "true"
  online:
    description: >-
      Also run the --online reputation checks (registry metadata, GitHub
      repository status, OpenSSF Scorecard). Uses github-token for GitHub API
      calls. Off by default; tfcap is offline unless you ask.
    default: "false"
  comment:
    description: Post or update a PR comment with the results.
    default: "true"
  sarif:
    description: Upload SARIF results to GitHub code scanning.
    default: "true"
  version:
    description: >-
      tfcap version to install from the Go module proxy (for example v0.1.0).
      Leave empty (the default) to build from this Action's own source, so the
      binary always matches the commit you pinned the Action to.
    default: ""
  github-token:
    description: Token used for the PR comment.
    default: ${{ github.token }}

outputs:
  approved:
    description: "approve-prepare: 'true' when an approved lock file was uploaded for approve-commit."
    value: ${{ steps.approve.outputs.approved }}
  exit-code:
    description: tfcap exit code (0 ok, 1 policy failure, 2 error).
    value: ${{ steps.run.outputs.exit-code || steps.approve.outputs.exit-code }}

runs:
  using: composite
  steps:
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: stable
        cache: false

    - name: Install tfcap
      shell: bash
      env:
        TFCAP_VERSION: ${{ inputs.version }}
      run: |
        if [ -z "$TFCAP_VERSION" ]; then
          cd "$GITHUB_ACTION_PATH"
          go install -trimpath ./cmd/tfcap
        else
          go install -trimpath "github.com/r-morato/tfcap/cmd/tfcap@${TFCAP_VERSION}"
        fi
        tfcap version

    - name: Run tfcap
      id: run
      if: ${{ !startsWith(inputs.mode, 'approve') }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        MODE: ${{ inputs.mode }}
        FAIL_ON: ${{ inputs.fail-on }}
        MIN_SEV: ${{ inputs.min-severity }}
        THIRD: ${{ inputs.third-party-only }}
        WD: ${{ inputs.working-directory }}
        ONLINE: ${{ inputs.online }}
        GITHUB_TOKEN: ${{ inputs.online == 'true' && inputs.github-token || '' }}
      run: |
        set +e
        case "$MODE" in
          verify|scan) ;;
          approve|approve-prepare|approve-commit) exit 0 ;; # handled below
          *) echo "::error::mode must be verify, scan, approve, approve-prepare or approve-commit"; exit 2 ;;
        esac
        extra=()
        if [ "$MODE" = scan ] && [ "$THIRD" = "true" ]; then extra+=(--third-party-only); fi
        if [ "$ONLINE" = "true" ]; then extra+=(--online); fi
        md=markdown; [ "$MODE" = scan ] && md=text
        tfcap "$MODE" . --format sarif --output "$RUNNER_TEMP/tfcap.sarif" --sarif-base "$WD" --fail-on none --min-severity "$MIN_SEV" "${extra[@]}"
        tfcap "$MODE" . --format "$md" --output "$RUNNER_TEMP/tfcap.md" --fail-on none --min-severity "$MIN_SEV" --no-color "${extra[@]}"
        tfcap "$MODE" . --fail-on "$FAIL_ON" --min-severity "$MIN_SEV" "${extra[@]}"
        code=$?
        echo "exit-code=$code" >> "$GITHUB_OUTPUT"
        if [ "$md" = text ]; then
          { echo '### tfcap scan'; echo '```'; cat "$RUNNER_TEMP/tfcap.md"; echo '```'; } > "$RUNNER_TEMP/tfcap.comment.md"
        else
          cp "$RUNNER_TEMP/tfcap.md" "$RUNNER_TEMP/tfcap.comment.md"
        fi
        cat "$RUNNER_TEMP/tfcap.comment.md" >> "$GITHUB_STEP_SUMMARY"
        exit 0

    - name: Download prepared approval
      if: inputs.mode == 'approve-commit'
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: tfcap-approval
        path: ${{ runner.temp }}/tfcap-approval

    - name: Approve module changes
      id: approve
      if: startsWith(inputs.mode, 'approve')
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        MODE: ${{ inputs.mode }}
        REPO: ${{ github.repository }}
        EVENT: ${{ github.event_name }}
        ACTION: ${{ github.event.action }}
        LABEL: ${{ github.event.label.name }}
        APPROVE_LABEL: ${{ inputs.approve-label }}
        ACTOR: ${{ github.event.sender.login }}
        HEAD_REF: ${{ github.head_ref }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        FAIL_ON: ${{ inputs.fail-on }}
        STATUS_CONTEXT: ${{ inputs.status-context }}
      run: |
        case "$MODE" in
          approve) step=all ;;
          approve-prepare) step=prepare ;;
          approve-commit) step=commit ;;
        esac
        bash "$GITHUB_ACTION_PATH/scripts/approve.sh" "$step"

    - name: Upload prepared approval
      if: inputs.mode == 'approve-prepare' && steps.approve.outputs.approved == 'true'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: tfcap-approval
        path: ${{ runner.temp }}/tfcap-approval
        retention-days: 1
        if-no-files-found: error

    - name: Upload SARIF
      if: ${{ !startsWith(inputs.mode, 'approve') && inputs.sarif == 'true' && steps.run.outputs.exit-code != '2' }}
      uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
      with:
        sarif_file: ${{ runner.temp }}/tfcap.sarif
        category: tfcap

    - name: Comment on PR
      if: inputs.comment == 'true' && github.event_name == 'pull_request' && steps.approve.outputs.skip-comment != 'true' && (steps.run.outputs.exit-code || steps.approve.outputs.exit-code) != '2'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        PR: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
      run: |
        file="$RUNNER_TEMP/tfcap.comment.md"
        grep -q '<!-- tfcap -->' "$file" || sed -i '1i <!-- tfcap -->' "$file"
        id=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
          --jq '[.[] | select(.body | contains("<!-- tfcap -->"))][0].id // empty')
        if [ -n "$id" ]; then
          gh api -X PATCH "repos/$REPO/issues/comments/$id" -F body=@"$file" >/dev/null
        else
          gh api -X POST "repos/$REPO/issues/$PR/comments" -F body=@"$file" >/dev/null
        fi

    - name: Enforce fail-on
      shell: bash
      env:
        CODE: ${{ steps.run.outputs.exit-code || steps.approve.outputs.exit-code }}
      run: exit "${CODE:-2}"
