version: 2
project_name: tfcap
builds:
  - main: ./cmd/tfcap
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    mod_timestamp: "{{ .CommitTimestamp }}" # reproducible builds
    ldflags: ["-s -w -X main.version={{ .Version }}"]
archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
# One CycloneDX SBOM per archive (requires syft on PATH).
sboms:
  - artifacts: archive
# Keyless Sigstore signature of the checksums file, so every archive is
# covered. Verify with `cosign verify-blob` (see SECURITY.md).
signs:
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args: ["sign-blob", "--bundle=${signature}", "--yes", "${artifact}"]
    output: true
changelog:
  sort: asc
