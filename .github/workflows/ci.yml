name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - name: Allow the sandbox tests to run (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo apt-get install -y --no-install-recommends strace >/dev/null || true
      - run: go test -race ./...
      - name: Test kit (10 scenarios)
        if: runner.os != 'Windows'
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          go build -o "$RUNNER_TEMP/bin/tfcap" ./cmd/tfcap
          PATH="$RUNNER_TEMP/bin:$PATH" examples/testkit/run-all.sh
      - name: Demo smoke test
        if: runner.os == 'Linux'
        run: |
          go run ./cmd/tfcap scan examples/upgrade-attack/before --fail-on low
          if go run ./cmd/tfcap diff examples/upgrade-attack/before examples/upgrade-attack/after; then
            echo "expected the upgrade attack to fail the diff" && exit 1
          fi
