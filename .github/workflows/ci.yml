name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race ./...
      - name: Demo smoke test
        if: runner.os == 'Linux'
        run: |
          go run ./cmd/tfcap scan examples/upgrade-attack/before --fail-on low
          if go run ./cmd/tfcap diff examples/upgrade-attack/before examples/upgrade-attack/after; then
            echo "expected the upgrade attack to fail the diff" && exit 1
          fi
