name: release
on:
  push:
    tags: ["v*.*.*"] # full versions only; the moving v0 tag must not trigger a release
permissions:
  contents: read
jobs:
  goreleaser:
    runs-on: ubuntu-latest
    permissions:
      contents: write     # create the release, move the major tag
      id-token: write     # keyless Sigstore signing and provenance
      attestations: write # GitHub build-provenance attestations
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Attest build provenance (SLSA)
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
      - name: Attach the provenance to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          # The DSSE envelope (an in-toto SLSA provenance statement), one per
          # line, so tools that look for *.intoto.jsonl release assets find it.
          jq -c '.dsseEnvelope' "$BUNDLE" > "tfcap_${TAG#v}.intoto.jsonl"
          gh release upload "$TAG" "tfcap_${TAG#v}.intoto.jsonl" --clobber
      - name: Point the major version tag (e.g. v0) at this release
        if: ${{ !contains(github.ref_name, '-') }} # skip pre-releases such as v1.0.0-rc.1
        env:
          TAG: ${{ github.ref_name }}
        run: |
          major="${TAG%%.*}"
          git tag -f "$major" "$GITHUB_SHA"
          git push -f origin "refs/tags/$major"
